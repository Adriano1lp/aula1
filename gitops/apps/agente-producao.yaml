# Produção segue o Git como fonte única da verdade. Mudanças manuais são
# revertidas pelo Argo CD; exceções emergenciais precisam virar commit/PR.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: agente-producao
  namespace: argocd
spec:
  project: default
  source:
    repoURL: REPO_URL
    targetRevision: main
    path: gitops/overlays/producao
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
